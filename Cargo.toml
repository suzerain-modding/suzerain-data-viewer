[package]
name = "suzerain_data_viewer"
version = "0.2.0"
edition = "2024"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
indicatif = "0.18.4"
indicatif-log-bridge = "0.2.3"
inquire = "0.9.4"
log = "0.4.29"
serde = "1.0.228"
serde_json = "1.0.150"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
simplelog = "0.12.2"
